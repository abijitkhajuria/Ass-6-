# =====================================================================
#  Demo profile - runs the whole API against an in-memory H2 database.
#
#  Use it to try the UI without configuring MySQL:
#      mvn spring-boot:run "-Pdemo" "-Dspring-boot.run.profiles=demo"
#
#  Data lives only for the life of the process. MySQL remains the
#  default and is what the app runs on normally.
# =====================================================================

spring.datasource.url=jdbc:h2:mem:vit_results;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.seed.enabled=true
