spring.application.name=vit-semester-results
server.port=8080

# ---------------------------------------------------------------------
# Datasource
# Replace the placeholders below with your own local MySQL credentials.
# Do not commit real passwords - override them with environment variables
# (DB_USERNAME / DB_PASSWORD) or a local application-local.properties.
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/vit_results?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:YOUR_MYSQL_USERNAME}
spring.datasource.password=${DB_PASSWORD:YOUR_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ---------------------------------------------------------------------
# Seeding
# On startup, if the tables are empty, the app loads the same cohort that
# db/seed.sql contains so the UI has data on first run. Set this to false
# if you prefer to seed manually with the MySQL client.
# ---------------------------------------------------------------------
app.seed.enabled=true

# ---------------------------------------------------------------------
# CORS - the Vite dev server origins.
# Any localhost port is allowed because Vite falls back to 5174, 5175, ...
# when 5173 is in use. Narrow this to exact origins before deploying.
# ---------------------------------------------------------------------
app.cors.allowed-origin-patterns=http://localhost:[*],http://127.0.0.1:[*]

# ---------------------------------------------------------------------
# Error responses
# ---------------------------------------------------------------------
server.error.include-message=always
server.error.include-binding-errors=always
